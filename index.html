<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Social Links Profile</title>
</head>
<body>
    <main>
        <div class="card">
            <img class="card-img" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
            <div class="card-content">
                <h1 class="card-content-title">Jessica Randall</h1>
                <p class="card-content-category">London, United Kingdom</p>
                <p class="card-content-description">"Front-end developer and avid reader."</p>
            </div>
            <div class="card-links">
                 <a href="#" class="card-links-social">GitHub</a>
                 <a href="#" class="card-links-social">Frontend Mentor</a>
                 <a href="#" class="card-links-social">LinkedIn</a>
                 <a href="#" class="card-links-social">Twitter</a>
                <a href="#" class="card-links-social">Instagram</a>
            </div>
        </div>
    </main>
</body>
</html>
